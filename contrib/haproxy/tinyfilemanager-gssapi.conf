LogFormat "%a %t \"%m %U %H\" %>s %b" tinyfilemanager_gssapi
SetEnvIf Request_URI "^/healthz[.]php$" tinyfilemanager_healthcheck

<VirtualHost *:8443>
    ServerName ${TFM_PUBLIC_HOST}
    DocumentRoot /var/www/html
    Protocols http/1.1

    SSLEngine On
    SSLCertificateFile /run/tls-runtime/tls.crt
    SSLCertificateKeyFile /run/tls-runtime/tls.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCompression Off

    # Browser-supplied identity and forwarding headers are never credentials.
    RequestHeader unset Remote-User early
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-Authenticated-User early
    RequestHeader unset X-Forwarded-User early
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader unset Client-IP early
    RequestHeader unset CF-Connecting-IP early

    <Location "/">
        AuthType GSSAPI
        AuthName "Tiny File Manager"
        GssapiAcceptorName HTTP@${TFM_PUBLIC_HOST}
        GssapiAllowedMech krb5
        GssapiBasicAuth Off
        GssapiConnectionBound Off
        GssapiLocalName Off
        GssapiNegotiateOnce On
        GssapiSSLonly On
        GssapiUseSessions Off
        AuthGroupFile /run/policy/authorized-users
        AuthzSendForbiddenOnFailure On
        Require group tinyfilemanager
    </Location>

    <Location "/healthz.php">
        AuthType None
        Require all granted
    </Location>

    # Authentication has already consumed the Negotiate token. Do not expose it
    # to PHP or retain it in application state.
    RequestHeader unset Authorization

    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog /dev/stderr
    CustomLog /dev/stdout tinyfilemanager_gssapi env=!tinyfilemanager_healthcheck
</VirtualHost>

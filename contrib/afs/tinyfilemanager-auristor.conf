# The exact provider directives are supplied and hash-locked by the private
# provider base assembled for the selected AuriStor release.
Include /etc/tinyfilemanager-auristor/provider-global.conf

<Directory "/var/www/html">
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require all granted

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>

<Files "config.php">
    Require all denied
</Files>

<Files "translation.json">
    Require all denied
</Files>

<VirtualHost *:8443>
    ServerName ${TFM_PUBLIC_HOST}
    DocumentRoot /var/www/html
    Protocols http/1.1

    SSLEngine On
    SSLCertificateFile /run/tls-runtime/tls.crt
    SSLCertificateKeyFile /run/tls-runtime/tls.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCompression Off

    Include /etc/tinyfilemanager-auristor/provider-enabled.conf

    RequestHeader unset Remote-User early
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-Authenticated-User early
    RequestHeader unset X-Forwarded-User early
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader unset Client-IP early
    RequestHeader unset CF-Connecting-IP early

    <Location "/">
        AuthType GSSAPI
        AuthName "Tiny File Manager"
        GssapiAcceptorName HTTP@${TFM_PUBLIC_HOST}
        GssapiCredStore keytab:/run/tinyfilemanager-keytab/http.keytab
        GssapiDelegCcacheDir /run/tinyfilemanager-auth/clientcaches
        GssapiDelegCcacheUnique On
        GssapiDelegCcacheEnvVar KRB5CCNAME
        GssapiDelegCcachePerms mode:0600 uid:apache gid:apache
        GssapiAllowedMech krb5
        GssapiBasicAuth Off
        GssapiConnectionBound Off
        GssapiLocalName Off
        GssapiNegotiateOnce On
        GssapiSSLonly On
        GssapiUseSessions Off
        AuthGroupFile /run/policy/authorized-users
        AuthzSendForbiddenOnFailure On
        Require group tinyfilemanager
    </Location>

    php_admin_value open_basedir "/var/www/html:/srv/tinyfilemanager/data:/tmp/tinyfilemanager-sessions:/tmp/tinyfilemanager-uploads"

    RequestHeader unset Authorization

    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog /dev/stderr
    LogLevel warn auth_gssapi:warn waklog:warn
    CustomLog /dev/stdout tinyfilemanager_auristor
</VirtualHost>

<VirtualHost 127.0.0.1:8081>
    ServerName localhost
    DocumentRoot /var/www/html

    Include /etc/tinyfilemanager-auristor/provider-disabled.conf

    <Location "/">
        Require all denied
    </Location>
    <Location "/healthz.php">
        AuthType None
        Require all granted
    </Location>

    ErrorLog /dev/stderr
    CustomLog /dev/null tinyfilemanager_auristor
</VirtualHost>
